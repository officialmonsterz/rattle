{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="logo">
        <i class="fas fa-ruler" style="font-size: 48px; color: #34a853;"></i>
        <h3>RATTLE</h3>
        <p class="text-muted">Admin Panel</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if mfa_mode %}
    <form method="POST" action="{{ url_for('mfa_verify') }}">
        <div class="mb-3">
            <label for="code" class="form-label">Enter 6-digit authenticator code</label>
            <input type="text" class="form-control" id="code" name="code"
                   inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-shield-halved"></i> Verify
        </button>
    </form>
    {% else %}
    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>
    {% endif %}
</div>
{% endblock %}
